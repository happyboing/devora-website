<!doctype html>
<html lang="en" data-boot="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04040a" />

    <title>Devora — Website Modernization &amp; Redesign</title>
    <meta
      name="description"
      content="Devora transforms outdated websites into modern, engaging and high-performing digital experiences. Website modernization, redesign, and user-centered UI/UX."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Devora — Explore Your Aura. Create with Devora." />
    <meta
      property="og:description"
      content="Modern websites. Meaningful experiences. Limitless possibilities."
    />

    <!--
      Startup screen, inlined so something branded is on screen before the
      stylesheet or the app bundle arrive. It runs a short, self-contained
      sequence — the wordmark letters rise, a hairline draws across and a
      counter resolves to 100 — then React (see PreloaderDismiss) flips the
      document to data-boot="done" and the whole panel lifts away like a
      curtain. The watchdog at the bottom guarantees it can never trap a
      visitor if the bundle fails to load.
    -->
    <style>
      html[data-boot='loading'] {
        overflow: hidden;
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 2.4rem;
        padding: 6vw;
        background:
          radial-gradient(60% 50% at 50% 40%, rgba(224, 66, 124, 0.16), transparent 70%),
          radial-gradient(48% 40% at 80% 78%, rgba(94, 214, 255, 0.1), transparent 70%), #04040a;
        transition:
          transform 0.82s cubic-bezier(0.76, 0, 0.24, 1),
          opacity 0.5s ease;
        will-change: transform;
      }

      html[data-boot='done'] #boot-screen {
        transform: translate3d(0, -101%, 0);
      }

      html:not([data-boot='loading']) #boot-screen {
        pointer-events: none;
      }

      .boot-inner {
        display: grid;
        justify-items: center;
        gap: 1.15rem;
        text-align: center;
        transition:
          opacity 0.34s ease,
          transform 0.34s ease;
      }

      html[data-boot='done'] .boot-inner {
        opacity: 0;
        transform: translate3d(0, -22px, 0);
      }

      .boot-eyebrow {
        margin: 0;
        color: #8b8fa3;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        opacity: 0;
        animation: boot-fade 0.7s ease 0.15s forwards;
      }

      .boot-word {
        margin: 0;
        display: flex;
        gap: 0.02em;
        font-family: 'Space Grotesk Variable', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(2.6rem, 11vw, 6.4rem);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .boot-letter {
        display: inline-block;
        background: linear-gradient(150deg, #fff 6%, #ffd6e8 52%, #ffc3dd 78%, #f58ab4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transform: translate3d(0, 118%, 0) rotate(6deg);
        opacity: 0;
        animation: boot-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: calc(0.1s + var(--i) * 0.065s);
      }

      .boot-rule {
        position: relative;
        width: min(74vw, 24rem);
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .boot-rule::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #e0427c 34%, #5ed6ff 78%, transparent);
        transform: scaleX(0);
        transform-origin: left center;
        animation: boot-draw 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
      }

      .boot-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        width: min(74vw, 24rem);
        gap: 1rem;
      }

      .boot-tagline {
        margin: 0;
        color: #9aa0b4;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        opacity: 0;
        animation: boot-fade 0.7s ease 0.5s forwards;
      }

      .boot-count {
        font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        color: #f4f5fa;
        font-variant-numeric: tabular-nums;
      }

      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @keyframes boot-rise {
        to {
          transform: translate3d(0, 0, 0) rotate(0deg);
          opacity: 1;
        }
      }

      @keyframes boot-fade {
        to {
          opacity: 1;
        }
      }

      @keyframes boot-draw {
        to {
          transform: scaleX(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-screen {
          transition: none;
        }

        .boot-letter,
        .boot-eyebrow,
        .boot-tagline,
        .boot-rule::after {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-screen" role="status" aria-live="polite">
      <div class="boot-inner">
        <p class="boot-eyebrow">Website Modernization Studio</p>
        <p class="boot-word" aria-hidden="true">
          <span class="boot-letter" style="--i: 0">D</span>
          <span class="boot-letter" style="--i: 1">E</span>
          <span class="boot-letter" style="--i: 2">V</span>
          <span class="boot-letter" style="--i: 3">O</span>
          <span class="boot-letter" style="--i: 4">R</span>
          <span class="boot-letter" style="--i: 5">A</span>
        </p>
        <div class="boot-rule" aria-hidden="true"></div>
        <div class="boot-meta">
          <p class="boot-tagline">Explore Your Aura · Create with Devora</p>
          <span class="boot-count" aria-hidden="true">000</span>
        </div>
      </div>
      <span class="boot-sr">Loading Devora</span>
    </div>

    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; color: #f5f6fa; background: #04040a; font-family: sans-serif">
        <h1>Devora</h1>
        <p>
          This website needs JavaScript enabled to display its interactive experience. Please enable
          JavaScript and reload the page.
        </p>
      </div>
    </noscript>

    <script>
      window.__devoraBootAt = Date.now()

      // Self-contained counter: eases up to 100 over ~1.1s, independent of the
      // bundle, so the number always feels alive rather than frozen.
      ;(function () {
        var count = document.querySelector('.boot-count')
        var reduce =
          window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches

        if (reduce) {
          if (count) count.textContent = '100'
          return
        }

        var start = performance.now()
        var DURATION = 900

        function tick(now) {
          var t = Math.min(1, (now - start) / DURATION)
          var eased = 1 - Math.pow(1 - t, 3)
          if (count) count.textContent = String(Math.round(eased * 100)).padStart(3, '0')
          if (t < 1) requestAnimationFrame(tick)
        }

        requestAnimationFrame(tick)
      })()

      // Watchdog: if the bundle never boots, don't trap the visitor behind the splash.
      window.setTimeout(function () {
        document.documentElement.setAttribute('data-boot', 'done')
        window.setTimeout(function () {
          var boot = document.getElementById('boot-screen')
          if (boot) boot.remove()
        }, 900)
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
